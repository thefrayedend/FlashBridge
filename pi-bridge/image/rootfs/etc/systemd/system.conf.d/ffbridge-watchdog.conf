# FlashBridge: if the whole box ever hangs (kernel stuck, no network, nothing answers), the
# hardware watchdog reboots it after 30 s instead of leaving it dead until somebody unplugs it.
# A reboot of the box never touches the printer: the print carries on by itself.
# Boards without a watchdog device simply ignore this (systemd logs one line).
[Manager]
RuntimeWatchdogSec=30s
RebootWatchdogSec=5min
