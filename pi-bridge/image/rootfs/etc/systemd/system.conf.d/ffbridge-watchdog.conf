# FlashBridge: hardware watchdog OFF (Coordinator, 2026-11-05).
# 1.0.48/1.0.49 set RuntimeWatchdogSec=30s. The Orange Pi Zero 4's watchdog does not accept that
# (its hardware limit is shorter), so systemd failed to keep it fed and the board reset itself
# about 30 s after every boot - a reboot loop on Jon's box. Hangs of the bridge program are
# handled by ffbridge-health (restarts only the bridge); a whole-board watchdog comes back only
# after it has been tested on each board with that board's real limit.
# This file must stay (an update can replace a file but not delete one): it switches the
# watchdog off on boxes that got the old setting.
[Manager]
RuntimeWatchdogSec=0
RebootWatchdogSec=0
